name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
  schedule:
    - cron: '0 19 1 * *'
    - cron: '0 19 * 12 *' # daily in December, in case next year's schedule is published late

# no default permissions; each job asks only for what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit fetched data
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: node --test
      - name: Fetch prayer schedules (skips files that already exist)
        run: node scripts/fetch-data.mjs
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "chore(data): update prayer schedules"
            git push
          fi

  deploy:
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js assets icons data _site/
          # version = hash of the app files, so phones only update when the app itself changed (not on data or docs changes)
          BUILD=$(cd _site && find index.html manifest.webmanifest sw.js css js assets icons data/cities.json -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
          sed -i "s/__BUILD__/$BUILD/" _site/sw.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
