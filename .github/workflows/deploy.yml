name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
  schedule:
    - cron: '0 19 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prayer schedules (skips files that already exist)
        run: node scripts/fetch-data.mjs
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "chore(data): update prayer schedules"
            git push
          fi

  deploy:
    needs: data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js assets icons data _site/
          # version = hash of the app files, so phones only update when the app itself changed (not on data or docs changes)
          BUILD=$(cd _site && find index.html manifest.webmanifest sw.js css js assets icons data/cities.json -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
          sed -i "s/__BUILD__/$BUILD/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
